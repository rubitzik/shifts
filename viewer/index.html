<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>סידור – צפייה</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="סידור – צפייה">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    #app {
      position: fixed; left: 0; right: 0;
      top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
      width: 100%; height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      border: 0;
    }
    .overlay {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #ffffff; color: #1e293b; text-align: center; padding: 24px;
      transition: opacity .3s;
    }
    .overlay img { width: 96px; height: 96px; border-radius: 22px; }
    .spinner { width: 32px; height: 32px; border: 4px solid #cbd5e1; border-top-color: #0f766e;
      border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { opacity: 0; pointer-events: none; }
    button { font: inherit; background: #0f766e; color: #fff; border: 0; border-radius: 10px; padding: 12px 24px; }
  </style>
</head>
<body>
  <iframe id="app" title="סידור עבודה – צפייה"></iframe>

  <div id="loading" class="overlay">
    <img src="icons/icon-192.png" alt="">
    <div class="spinner"></div>
    <div>טוען את הסידור…</div>
  </div>

  <div id="offline" class="overlay hidden">
    <img src="icons/icon-192.png" alt="">
    <div>אין חיבור לאינטרנט.<br>הסידור ייטען כשהחיבור יחזור.</div>
    <button onclick="location.reload()">נסה שוב</button>
  </div>

  <script>
    // ⬇️ קישור הצופה מהמערכת (אם יוצרים קישור חדש במסך המנהל — מחליפים כאן)
    const VIEWER_URL = 'https://script.google.com/macros/s/AKfycbywDTO0BDUstNSntCFlj7yjGV_lmOwmtbUg-2hoyNYmoUAOKXmGjZbZlAgTWGIpcCjLMQ/exec?view=viewer&key=8c67daaa7dcd4e9a91fc629aad2f9913';

    const frame = document.getElementById('app');
    const loading = document.getElementById('loading');
    const offline = document.getElementById('offline');

    function start() {
      if (!navigator.onLine) { offline.classList.remove('hidden'); loading.classList.add('hidden'); return; }
      offline.classList.add('hidden');
      frame.src = VIEWER_URL;
    }
    frame.addEventListener('load', () => { if (frame.src) loading.classList.add('hidden'); });
    window.addEventListener('online', () => { if (!frame.src) start(); });
    // אם הטעינה נתקעת, לא משאירים מסך טעינה לנצח
    setTimeout(() => loading.classList.add('hidden'), 15000);

    // כשחוזרים לאפליקציה אחרי זמן רב — רענון, כדי לראות סידור מעודכן
    let hiddenAt = 0;
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { hiddenAt = Date.now(); return; }
      if (hiddenAt && Date.now() - hiddenAt > 30 * 60 * 1000) frame.src = VIEWER_URL;
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { scope: './' });
    start();
  </script>
</body>
</html>
